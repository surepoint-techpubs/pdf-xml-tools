<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF-XML</title>
<link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body>
<header class="topbar">
	<a href="{{ url_for('extract.index') }}" class="brand">PDF-XML</a>
	{% if session.get('user_id') %}
	<span class="topbar-user">{{ session.get('username') }}</span>
	{% if session.get('is_admin') %}
	<a href="{{ url_for('admin.settings') }}" class="icon-link" title="Admin settings" aria-label="Admin settings">
		<img src="{{ url_for('static', filename='images/gear_icon.png') }}" alt="Admin settings">
	</a>
	{% endif %}
	<form method="post" action="{{ url_for('auth.logout') }}">
		<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
		<button type="submit" class="icon-link" title="Log out" aria-label="Log out">
			<img src="{{ url_for('static', filename='images/logout_icon.png') }}" alt="Log out">
		</button>
	</form>
	{% endif %}
</header>
{% block content %}{% endblock %}
</body>
</html>
