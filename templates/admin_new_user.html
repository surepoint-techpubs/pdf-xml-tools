{% extends "base.html" %}
{% block content %}
<div class="page-container">
	<h1 class="tools-heading">Add user</h1>
	{% if error %}<p class="error-text">{{ error }}</p>{% endif %}
	<form method="post">
		<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
		<div class="field">
			<label for="username">Username</label>
			<input type="text" id="username" name="username" required autofocus>
		</div>
		<div class="field">
			<label for="password">Password</label>
			<input type="password" id="password" name="password" required minlength="12">
		</div>
		<div class="field">
			<label for="confirm">Confirm password</label>
			<input type="password" id="confirm" name="confirm" required minlength="12">
		</div>
		<div class="field">
			<label><input type="checkbox" name="is_admin"> Admin</label>
		</div>
		<p>
			<button type="submit">Add user</button>
			<a href="{{ url_for('admin.settings') }}">Cancel</a>
		</p>
	</form>
</div>
{% endblock %}
